<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDSS 臨床輔助診斷系統 | 理學檢查與症狀評估</title>
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

        :root {
            --primary: #2C73D2;
            --secondary: #0081C9;
            --accent: #5C9CE6;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            
            /* 診斷狀態顏色 */
            --status-strep: #e74c3c;
            --status-cold: #f39c12;
            --status-allergy: #27ae60;
            --status-warning: #e67e22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .content-body {
            padding: 30px;
        }

        .symptom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .form-group:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .label-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .label-icon {
            color: var(--primary);
            width: 25px;
            font-size: 1.1rem;
        }

        .label-text {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .term-en {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 5px;
            font-style: italic;
        }

        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            background-color: white;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            appearance: none; /* 移除預設箭頭以便自訂 */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c3e50' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 115, 210, 0.2);
        }

        /* 診斷結果區塊動畫與樣式 */
        .result-container {
            margin-top: 20px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 0;
            overflow: hidden;
        }

        .result-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            height: auto;
            padding-bottom: 10px;
        }

        .result-card {
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-left: 6px solid #ccc;
        }

        /* 狀態色彩類別 */
        .result-card.status-strep {
            background-color: #fdf3f2;
            border-left-color: var(--status-strep);
        }
        .result-card.status-cold {
            background-color: #fef9f1;
            border-left-color: var(--status-cold);
        }
        .result-card.status-allergy {
            background-color: #f4fbf7;
            border-left-color: var(--status-allergy);
        }
        .result-card.status-warning {
            background-color: #fff8f3;
            border-left-color: var(--status-warning);
        }

        .result-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .diagnosis-output {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-strep .diagnosis-output { color: var(--status-strep); }
        .status-cold .diagnosis-output { color: var(--status-cold); }
        .status-allergy .diagnosis-output { color: var(--status-allergy); }
        .status-warning .diagnosis-output { color: var(--status-warning); font-size: 1.1rem; }

        .diagnosis-en {
            display: block;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* 底部裝飾 */
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #aaa;
            border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .symptom-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 20px 15px;
            }
            .content-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <i class="fa-solid fa-laptop-medical header-icon"></i>
        <h1>CDSS 臨床輔助診斷系統</h1>
        <p>理學檢查與症狀評估 (Symptom Assessment)</p>
    </div>
    
    <div class="content-body">
        <div class="symptom-grid">
            
            <!-- 核心鑑別指標優先放前面 -->
            <div class="form-group" style="border-left: 4px solid var(--primary);">
                <div class="label-wrapper">
                    <i class="fa-solid fa-arrows-to-circle label-icon"></i>
                    <span class="label-text">淋巴腺腫脹</span>
                    <span class="term-en">(Lymphadenopathy)</span>
                </div>
                <select id="lymph" class="symptom-input">
                    <option value="">-- 尚未評估 --</option>
                    <option value="yes">陽性 (+) 有腫脹</option>
                    <option value="no">陰性 (-) 無腫脹</option>
                </select>
            </div>

            <div class="form-group" style="border-left: 4px solid var(--primary);">
                <div class="label-wrapper">
                    <i class="fa-solid fa-temperature-high label-icon"></i>
                    <span class="label-text">發燒</span>
                    <span class="term-en">(Pyrexia)</span>
                </div>
                <select id="fever" class="symptom-input">
                    <option value="">-- 尚未評估 --</option>
                    <option value="yes">陽性 (+) 有發燒</option>
                    <option value="no">陰性 (-) 無發燒</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-wrapper">
                    <i class="fa-solid fa-head-side-cough label-icon"></i>
                    <span class="label-text">喉嚨痛</span>
                    <span class="term-en">(Pharyngalgia)</span>
                </div>
                <select id="throat" class="symptom-input">
                    <option value="">-- 尚未評估 --</option>
                    <option value="yes">陽性 (+) 有喉痛</option>
                    <option value="no">陰性 (-) 無喉痛</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-wrapper">
                    <i class="fa-solid fa-eye-dropper label-icon"></i>
                    <span class="label-text">充血</span>
                    <span class="term-en">(Hyperemia)</span>
                </div>
                <select id="hyper" class="symptom-input">
                    <option value="">-- 尚未評估 --</option>
                    <option value="yes">陽性 (+) 有充血</option>
                    <option value="no">陰性 (-) 無充血</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-wrapper">
                    <i class="fa-solid fa-head-side-virus label-icon"></i>
                    <span class="label-text">頭痛</span>
                    <span class="term-en">(Cephalalgia)</span>
                </div>
                <select id="headache" class="symptom-input">
                    <option value="">-- 尚未評估 --</option>
                    <option value="yes">陽性 (+) 有頭痛</option>
                    <option value="no">陰性 (-) 無頭痛</option>
                </select>
            </div>
        </div>

        <div id="result-container" class="result-container">
            <div id="result-card" class="result-card">
                <div class="result-title">初步診斷印象 (Diagnostic Impression)</div>
                <div id="diagnosis-result" class="diagnosis-output"></div>
                <div id="diagnosis-en" class="diagnosis-en"></div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        C4.5 Decision Tree Model • Min Size Leaf=2 • CF=0.25
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.symptom-input');
    const resultContainer = document.getElementById('result-container');
    const resultCard = document.getElementById('result-card');
    const diagnosisResult = document.getElementById('diagnosis-result');
    const diagnosisEn = document.getElementById('diagnosis-en');

    function evaluateDiagnosis() {
        const lymph = document.getElementById('lymph').value;
        const fever = document.getElementById('fever').value;
        const throat = document.getElementById('throat').value;
        const hyper = document.getElementById('hyper').value;
        const headache = document.getElementById('headache').value;

        // 如果全部未選擇，隱藏結果區塊
        if (!lymph && !fever && !throat && !hyper && !headache) {
            resultContainer.classList.remove('show');
            return;
        }

        // 顯示結果區塊
        resultContainer.classList.add('show');
        
        // 重置狀態 class
        resultCard.className = 'result-card';
        let diagZh = "";
        let diagEn = "";
        let iconHtml = "";

        // 套用 C4.5 決策樹邏輯
        if (lymph === 'yes') {
            resultCard.classList.add('status-strep');
            iconHtml = '<i class="fa-solid fa-triangle-exclamation"></i>';
            diagZh = "鏈球菌性喉炎";
            diagEn = "Streptococcal Pharyngitis";
        } else if (lymph === 'no') {
            if (fever === 'yes') {
                resultCard.classList.add('status-cold');
                iconHtml = '<i class="fa-solid fa-virus"></i>';
                diagZh = "一般感冒";
                diagEn = "Common Cold / URI";
            } else if (fever === 'no') {
                resultCard.classList.add('status-allergy');
                iconHtml = '<i class="fa-solid fa-leaf"></i>';
                diagZh = "過敏反應";
                diagEn = "Allergy";
            } else {
                resultCard.classList.add('status-warning');
                iconHtml = '<i class="fa-solid fa-circle-exclamation"></i>';
                diagZh = "【資料不足】需評估「發燒」指標";
                diagEn = "Further assessment of Pyrexia required.";
            }
        } else {
            resultCard.classList.add('status-warning');
            iconHtml = '<i class="fa-solid fa-circle-exclamation"></i>';
            diagZh = "【資料不足】需優先評估「淋巴腺腫脹」";
            diagEn = "Primary assessment of Lymphadenopathy required.";
        }

        diagnosisResult.innerHTML = `${iconHtml} ${diagZh}`;
        diagnosisEn.innerHTML = diagEn;
    }

    inputs.forEach(input => {
        input.addEventListener('change', evaluateDiagnosis);
    });
</script>

</body>
</html>
